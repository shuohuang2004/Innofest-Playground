name: PR Lie Detector Review Gate

on:
  pull_request:
    types: [review_requested]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      # Replace this with the real detector repository after it is pushed.
      - name: Checkout PR Lie Detector
        uses: actions/checkout@v4
        with:
          repository: your-org/pr-lie-detector-mvp
          path: detector
          fetch-depth: 1
          # token: ${{ secrets.DETECTOR_REPO_TOKEN }} # Needed if the detector repo is private.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout PR branch and collect PR metadata
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr checkout "$PR_NUMBER"
          gh pr view "$PR_NUMBER" --json title --jq '.title' > ../pr-title.txt
          gh pr view "$PR_NUMBER" --json body --jq '.body // ""' > ../pr-body.md
          gh pr view "$PR_NUMBER" --json baseRefName --jq '.baseRefName' > ../base-ref.txt
          git fetch origin "$(cat ../base-ref.txt)" --depth=1

      - name: Generate truth report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_LIE_DETECTOR_MODEL: gpt-4.1-mini
        run: |
          node detector/bin/pr-lie-detector.js \
            --repo repo \
            --range "origin/$(cat base-ref.txt)...HEAD" \
            --title "$(cat pr-title.txt)" \
            --body-file pr-body.md \
            --output report.md \
            --json report.json

      - name: Remove requested reviewer when Truth Score is too low
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LIE_DETECTOR_REVIEW_THRESHOLD: 70
        run: |
          node detector/bin/pr-lie-detector-review-gate.js \
            --mode unrequest \
            --github-repo "${{ github.repository }}" \
            --pr "$PR_NUMBER" \
            --report-json report.json \
            --report-md report.md \
            --threshold "$PR_LIE_DETECTOR_REVIEW_THRESHOLD"

      - name: Create or update PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node detector/bin/pr-lie-detector-comment.js \
            --github-repo "${{ github.repository }}" \
            --pr "$PR_NUMBER" \
            --body-file report.md

      - name: Fail check when Truth Score is too low
        run: |
          node detector/bin/pr-lie-detector-review-gate.js \
            --mode check \
            --report-json report.json \
            --threshold 70 \
            --fail
