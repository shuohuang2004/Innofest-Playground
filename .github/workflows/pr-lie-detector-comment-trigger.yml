name: PR Lie Detector Comment Trigger

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lie-detect:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/lie-detect') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: React to trigger comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -H "Accept: application/vnd.github+json" \
            -f content=eyes || true

      - name: Show running status in PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_USER: ${{ github.event.comment.user.login }}
        run: |
          cat > report.md <<EOF
          <!-- pr-lie-detector:report -->
          ## PR Lie Detector

          > [!NOTE]
          > Analysis is running. The Truth Report will replace this message in a few seconds.

          **Triggered by:** @$TRIGGER_USER
          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          node ./bin/pr-lie-detector-comment.js \
            --github-repo "${{ github.repository }}" \
            --pr "$PR_NUMBER" \
            --body-file report.md

      - name: Checkout PR branch and collect metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr checkout "$PR_NUMBER"
          gh pr view "$PR_NUMBER" --json title --jq '.title' > pr-title.txt
          gh pr view "$PR_NUMBER" --json body --jq '.body // ""' > pr-body.md
          gh pr view "$PR_NUMBER" --json baseRefName --jq '.baseRefName' > base-ref.txt
          git fetch origin "$(cat base-ref.txt):refs/remotes/origin/$(cat base-ref.txt)" --depth=100

      - name: Generate truth report
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_LIE_DETECTOR_AI_PROVIDER: openrouter
          PR_LIE_DETECTOR_MODEL: google/gemini-2.5-flash
          PR_LIE_DETECTOR_BANNER_URL: ${{ vars.PR_LIE_DETECTOR_BANNER_URL }}
        run: |
          node ./bin/pr-lie-detector.js \
            --repo . \
            --range "origin/$(cat base-ref.txt)...HEAD" \
            --title "$(cat pr-title.txt)" \
            --body-file pr-body.md \
            --output report.md \
            --json report.json

      - name: Create or update PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          node ./bin/pr-lie-detector-comment.js \
            --github-repo "${{ github.repository }}" \
            --pr "$PR_NUMBER" \
            --body-file report.md
